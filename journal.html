<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — Florida Kimono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #F7F2E7;
    --ivory-soft: #EFE8D8;
    --indigo-deep: #16324A;
    --indigo: #2C5A78;
    --vermillion: #E34234;
    --sumi-ink: #2B2b2b;
    --kimono-gold: #E2B654;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--ivory);
    color: var(--sumi-ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3 {
    font-family: 'Shippori Mincho', serif;
    color: var(--indigo-deep);
    font-weight: 700;
  }

  .wave-band {
    width: 100%;
    height: 28px;
    background-image: radial-gradient(circle at 50% -50%, transparent 0, transparent 18px, var(--indigo) 19px, var(--indigo) 20px, transparent 21px);
    background-size: 40px 40px;
    background-position: 0 0, 20px 0;
    opacity: 0.85;
  }
  .wave-band.flip { transform: scaleY(-1); }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 6vw;
    background: rgba(247, 242, 231, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(22, 50, 74, 0.12);
  }

  .wordmark {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.25rem;
    letter-spacing: 0.04em;
    color: var(--indigo-deep);
    text-decoration: none;
  }
  .wordmark span { color: var(--vermillion); }

  .hamburger {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    width: 40px;
    height: 40px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 101;
  }
  .hamburger-line {
    width: 24px;
    height: 2px;
    background: var(--indigo-deep);
    border-radius: 1px;
    transition: transform 0.25s ease, opacity 0.25s ease, background 0.25s ease;
  }
  .hamburger:hover .hamburger-line { background: var(--vermillion); }
  .hamburger[aria-expanded="true"] .hamburger-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger[aria-expanded="true"] .hamburger-line:nth-child(2) { opacity: 0; }
  .hamburger[aria-expanded="true"] .hamburger-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-nav {
    position: absolute;
    top: 100%;
    left: 6vw;
    right: 6vw;
    display: flex;
    flex-direction: column;
    background: var(--ivory);
    border: 1px solid rgba(22, 50, 74, 0.12);
    border-top: none;
    box-shadow: 0 14px 28px rgba(22, 50, 74, 0.14);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.25s ease;
  }
  .mobile-nav.open {
    max-height: 480px;
    opacity: 1;
  }
  .mobile-nav a {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--indigo-deep);
    text-decoration: none;
    padding: 16px 22px;
    border-bottom: 1px solid rgba(22, 50, 74, 0.08);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .mobile-nav a:last-child { border-bottom: none; }
  .mobile-nav a:hover {
    background: var(--ivory-soft);
    color: var(--vermillion);
  }

  .lang-toggle {
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid var(--indigo-deep);
    border-radius: 999px;
    padding: 3px;
    margin-right: 14px;
    background: transparent;
  }
  .lang-toggle button {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--indigo-deep);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .lang-toggle button.active {
    background: var(--vermillion);
    color: var(--ivory);
  }
  .lang-toggle button:hover:not(.active) { color: var(--vermillion); }
  .lang-toggle button:focus-visible {
    outline: 2px solid var(--vermillion);
    outline-offset: 2px;
  }
  .header-controls {
    display: flex;
    align-items: center;
  }

  @media (max-width: 520px) {
    .lang-toggle { margin-right: 8px; }
    .lang-toggle button { padding: 5px 9px; font-size: 0.68rem; }
  }

  /* ---------- Page hero ---------- */
  .page-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 128px 6vw 48px;
  }
  .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--vermillion);
    margin-bottom: 14px;
    font-weight: 700;
  }
  .page-hero h1 {
    font-size: clamp(1.6rem, 3.6vw, 2.75rem);
    line-height: 1.25;
    max-width: 30ch;
    margin-bottom: 14px;
  }
  .page-hero .tagline {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--indigo);
    max-width: 52ch;
    font-weight: 400;
  }

  /* ---------- Journal ---------- */
  .journal-section {
    max-width: 760px;
    margin: 0 auto;
    padding: 70px 6vw 90px;
  }

  .journal-post {
    background: var(--ivory-soft);
    border: 1px solid rgba(22, 50, 74, 0.12);
    border-left: 4px solid var(--vermillion);
    border-radius: 6px;
    padding: 30px clamp(22px, 4vw, 38px);
    margin-bottom: 28px;
  }
  .journal-post:last-child { margin-bottom: 0; }

  .post-date {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--vermillion);
    margin-bottom: 6px;
  }
  .post-title {
    font-size: clamp(1.3rem, 2.6vw, 1.7rem);
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .post-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .post-tag {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--indigo-deep);
    background: var(--ivory);
    border: 1px solid var(--kimono-gold);
    border-radius: 999px;
    padding: 3px 12px;
  }
  .post-body {
    font-size: 0.98rem;
    line-height: 1.75;
    color: var(--sumi-ink);
    opacity: 0.9;
  }
  .post-body p { margin-bottom: 14px; }
  .post-body p:last-child { margin-bottom: 0; }
  .post-body ul, .post-body ol { margin: 0 0 14px 22px; }
  .post-body a {
    color: var(--vermillion);
    text-decoration: none;
    border-bottom: 1px solid rgba(227, 66, 52, 0.4);
    transition: border-color 0.2s ease;
  }
  .post-body a:hover { border-bottom-color: var(--vermillion); }
  .post-body img {
    max-width: 100%;
    border-radius: 4px;
    margin: 6px 0 14px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--sumi-ink);
    opacity: 0.6;
    font-size: 0.92rem;
    background: var(--ivory-soft);
    border: 1px dashed rgba(22, 50, 74, 0.2);
    border-radius: 6px;
  }

  /* ---------- Footer ---------- */
  .social-links {
    display: flex;
    gap: 22px;
  }
  .social-links a {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--indigo-deep);
    text-decoration: none;
    position: relative;
    transition: color 0.25s ease;
  }
  .social-links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: -4px;
    width: 0; height: 1px;
    background: var(--vermillion);
    transition: width 0.25s ease;
  }
  .social-links a:hover { color: var(--vermillion); }
  .social-links a:hover::after { width: 100%; }

  footer {
    padding: 50px 6vw 40px;
    text-align: center;
    background: var(--ivory);
  }
  footer .social-links {
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  footer .copyright {
    font-size: 0.8rem;
    color: var(--sumi-ink);
    opacity: 0.55;
  }

  @media (max-width: 720px) {
    header { padding: 14px 5vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <a href="index.html" class="wordmark">Florida Kimono <span>Club</span></a>

  <div class="header-controls">
    <div class="lang-toggle" role="group" aria-label="Language / 言語">
      <button id="lang-en" class="active" onclick="setLang('en')" aria-pressed="true">EN</button>
      <button id="lang-ja" onclick="setLang('ja')" aria-pressed="false">JA</button>
    </div>

    <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <a href="index.html" data-i18n="nav-home">Home</a>
    <a href="index.html#events" data-i18n="nav-calendar">Calendar</a>
    <a href="aboutus.html" data-i18n="nav-about">About Us</a>
    <a href="journal.html" data-i18n="nav-journal">Journal</a>
    <a href="art.html" data-i18n="nav-art">Art</a>
    <a href="https://www.instagram.com/floridakimono?igsh=bzM0aGx1cmR6M29v" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/groups/floridakimonoclub" target="_blank">Facebook</a>
  </nav>
</header>

<section class="page-hero">
  <div class="eyebrow" data-i18n="hero-eyebrow">From the Command Center</div>
  <h1 data-i18n="hero-title">Journal</h1>
  <p class="tagline" data-i18n="hero-tagline">What we're working on, what's coming next, and ideas for the future of Florida Kimono.</p>
</section>

<div class="wave-band"></div>

<section class="journal-section" aria-label="Journal posts">
  <div id="journal-feed"></div>
</section>

<div class="wave-band flip"></div>

<footer>
  <nav class="social-links">
    <a href="index.html" data-i18n="nav-home">Home</a>
    <a href="index.html#events" data-i18n="nav-calendar">Calendar</a>
    <a href="aboutus.html" data-i18n="nav-about">About Us</a>
    <a href="art.html" data-i18n="nav-art">Art</a>
    <a href="https://www.instagram.com/floridakimono" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/groups/floridakimonoclub" target="_blank">Facebook</a>
  </nav>
  <p class="copyright" data-i18n="footer-copyright">&copy; 2026 Florida Kimono Delegation. All rights reserved.</p>
</footer>

<!-- ---------- Language Toggle (EN / JA) ---------- -->
<script>
  const STRINGS = {
    'nav-home': { en: 'Home', ja: 'ホーム' },
    'nav-calendar': { en: 'Calendar', ja: 'カレンダー' },
    'nav-about': { en: 'About Us', ja: '私たちについて' },
    'nav-journal': { en: 'Journal', ja: 'ジャーナル' },
    'nav-art': { en: 'Art', ja: 'アート' },
    'hero-eyebrow': { en: 'From the Command Center', ja: '司令室より' },
    'hero-title': { en: 'Journal', ja: 'ジャーナル' },
    'hero-tagline': { en: "What we're working on, what's coming next, and ideas for the future of Florida Kimono.", ja: '現在の取り組み、これからの予定、そしてFlorida Kimonoの未来へのアイデア。' },
    'empty-state': { en: 'No posts yet — check back soon.', ja: 'まだ投稿はありません。近日中にご確認ください。' },
    'footer-copyright': { en: '&copy; 2026 Florida Kimono Delegation. All rights reserved.', ja: '&copy; 2026 Florida Kimono Delegation. All rights reserved.' }
  };

  let currentLang = localStorage.getItem('fk-lang') || 'en';

  function t(key) {
    const entry = STRINGS[key];
    if (!entry) return '';
    return entry[currentLang] || entry.en;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang === 'ja' ? 'ja' : 'en';

    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      const key = el.getAttribute('data-i18n');
      if (STRINGS[key]) el.innerHTML = t(key);
    });

    document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
    document.getElementById('lang-ja').classList.toggle('active', currentLang === 'ja');
    document.getElementById('lang-en').setAttribute('aria-pressed', currentLang === 'en');
    document.getElementById('lang-ja').setAttribute('aria-pressed', currentLang === 'ja');

    renderPosts();
  }

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('fk-lang', lang);
    applyTranslations();
  }

  document.addEventListener('DOMContentLoaded', applyTranslations);
</script>

<!-- ---------- Hamburger menu toggle ---------- -->
<script>
  const hamburger = document.querySelector('.hamburger');
  const mobileNav = document.getElementById('mobileNav');

  hamburger.addEventListener('click', function () {
    const isOpen = mobileNav.classList.toggle('open');
    hamburger.setAttribute('aria-expanded', isOpen);
  });

  mobileNav.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function () {
      mobileNav.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    });
  });

  document.addEventListener('click', function (e) {
    if (!hamburger.contains(e.target) && !mobileNav.contains(e.target)) {
      mobileNav.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      mobileNav.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
    }
  });
</script>

<!-- Journal posts live in journal.js — that's the only file you need to
     touch to add, edit, or remove posts. This tag just loads it. -->
<script src="journal.js"></script>
<script>
  function fmtPostDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const localeTag = currentLang === 'ja' ? 'ja-JP' : 'en-US';
    return d.toLocaleDateString(localeTag, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  function renderPosts() {
    const feed = document.getElementById('journal-feed');
    if (typeof POSTS === 'undefined' || POSTS.length === 0) {
      feed.innerHTML = `<div class="empty-state">${t('empty-state')}</div>`;
      return;
    }
    const sorted = [...POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));
    feed.innerHTML = sorted.map(post => {
      const tags = (post.tags && post.tags.length)
        ? `<div class="post-tags">${post.tags.map(tag => `<span class="post-tag">${tag}</span>`).join('')}</div>`
        : '';
      return `
        <article class="journal-post">
          <p class="post-date">${fmtPostDate(post.date)}</p>
          <h2 class="post-title">${post.title}</h2>
          ${tags}
          <div class="post-body">${post.body}</div>
        </article>
      `;
    }).join('');
  }

  renderPosts();
</script>
</body>
</html>

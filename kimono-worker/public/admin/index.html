<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Command Center — Florida Kimono Club</title>
<!-- Ported from kimono-admin/app/admin/page.tsx + globals.css: same design
     system ("girly pop": pastel gradient ground, bright pop accents per
     section), same approve/deny/edit flow, no framework — this page is a
     static asset and all state lives in plain JS below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');

:root {
  --bg-1: #fdebf3; --bg-2: #f1e8fb; --bg-3: #e8f8f0; --bg-4: #fff6dc;
  --color-text: #2a2230;
  --color-surface: #ffffff;
  --color-divider: color-mix(in srgb, #2a2230 14%, transparent);
  --color-neutral-100: #f8f5fb; --color-neutral-200: #ece5f2;
  --color-neutral-500: #a79bb3; --color-neutral-600: #8a7d97; --color-neutral-700: #6b5f78;
  --pop-pink: #ff5fa6; --pop-pink-100: #ffe3f0; --pop-pink-700: #c22f74;
  --pop-purple: #9b5de5; --pop-purple-100: #f1e5fd; --pop-purple-700: #6d34b0;
  --pop-yellow: #ffd23f; --pop-yellow-100: #fff6d9; --pop-yellow-700: #ad7d00;
  --pop-teal: #2ec4b6; --pop-teal-100: #dff8f5; --pop-teal-700: #16847a;
  --color-accent: var(--pop-pink); --color-accent-600: #e0448c; --color-accent-700: var(--pop-pink-700);
  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;
  --space-1: 4.4px; --space-2: 8.8px; --space-3: 13.2px; --space-4: 17.6px;
  --space-6: 26.4px; --space-7: 30.8px; --space-8: 35.2px;
  --radius-md: 16px; --radius-lg: 28px;
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2a2230 14%, transparent);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 70%, var(--bg-4) 100%);
  background-attachment: fixed;
}
h1, h2, h3 { font-family: var(--font-heading); font-weight: 400; line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2); }
a { color: var(--color-accent-700); text-underline-offset: 3px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: 400; font-size: 14px; line-height: 1.2;
  color: var(--color-text); background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2); border-radius: 999px;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--color-accent-600); }
.btn-secondary { border-color: var(--color-divider); background: #fff; }
.btn-secondary:hover:not(:disabled) { background: var(--color-neutral-100); }
.btn-danger { border-color: color-mix(in srgb, #d6336c 40%, var(--color-divider)); color: #d6336c; background: #fff; }
.btn-danger:hover:not(:disabled) { background: color-mix(in srgb, #d6336c 10%, transparent); }

.input {
  width: 100%; min-height: 36px; padding: 6px 14px; font: inherit; font-size: 14px;
  color: var(--color-text); background: var(--color-neutral-100);
  border: 1px solid var(--color-divider); border-radius: 999px;
}
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; border-radius: var(--radius-md); resize: vertical; }

.tag { display: inline-flex; align-items: center; font-size: 11px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 999px; }
.tag-pink { background: var(--pop-pink-100); color: var(--pop-pink-700); }
.tag-purple { background: var(--pop-purple-100); color: var(--pop-purple-700); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent-700); }

.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { background: #2b2154; color: #f4f0fb; padding: var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-6); }
.brand { font-family: var(--font-heading); font-size: 20px; line-height: 1.2; color: #fff; }
.navlink { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg); color: #f4f0fb; text-decoration: none; font-weight: 600; font-size: 14px; }
.navlink .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.navlink.active { background: rgba(255,255,255,0.16); color: #fff; }
.navlink.disabled { color: rgba(244,240,251,0.55); cursor: default; }
.main { padding: var(--space-7) var(--space-8); display: flex; flex-direction: column; gap: var(--space-7); max-width: 1180px; }
.pagehead h1 { font-size: 32px; margin: 0 0 var(--space-1); }
.pagehead p { margin: 0; color: var(--color-neutral-700); }

.stats { display: flex; gap: var(--space-4); flex-wrap: wrap; }
.stat { flex: 1; min-width: 140px; background: #fff; border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-sm); }
.stat .n { font-family: var(--font-heading); font-size: 28px; }
.stat .l { font-size: 13px; color: var(--color-neutral-700); }
.stat.c-pink .n { color: var(--pop-pink-700); }
.stat.c-purple .n { color: var(--pop-purple-700); }
.stat.c-yellow .n { color: var(--pop-yellow-700); }
.stat.c-teal .n { color: var(--pop-teal-700); }

.panel { background: #fff; border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: var(--space-4); }
.panel-pink { border: 3px solid var(--pop-pink); }
.panel-purple { border: 3px solid var(--pop-purple); }
.panelhead { display: flex; justify-content: space-between; align-items: baseline; }
.panelhead h2 { font-size: 20px; margin: 0; }
.panelhead .sub { font-size: 13px; color: var(--color-neutral-600); }
.muted { color: var(--color-neutral-600); }

.approval-row { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--color-neutral-200); border-radius: var(--radius-md); background: #fff; }
.approval-row.event-approved { border-color: var(--pop-pink); background: var(--pop-pink-100); }
.approval-row.signup-approved { border-color: var(--pop-purple); background: var(--pop-purple-100); }
.approval-row.denied { border-color: #d6336c; background: color-mix(in srgb, #d6336c 6%, transparent); }
.approval-row h3 { margin: 0; font-size: 16px; }
.approval-row .meta { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-1); }
.approval-row .fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.approval-row .fields textarea { grid-column: 1 / -1; }
.actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .side { flex-direction: row; flex-wrap: wrap; align-items: center; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">Florida Kimono<br>Club — Command</div>
    <a class="navlink active" href="#">Approvals</a>
    <a class="navlink disabled" href="#" tabindex="-1"><span class="dot" style="background: var(--pop-pink)"></span>Calendar</a>
    <a class="navlink disabled" href="#" tabindex="-1"><span class="dot" style="background: var(--pop-yellow)"></span>Organizers &amp; Venues</a>
    <a class="navlink disabled" href="#" tabindex="-1"><span class="dot" style="background: var(--pop-purple)"></span>Subscribers</a>
    <a class="navlink disabled" href="#" tabindex="-1"><span class="dot" style="background: var(--pop-teal)"></span>Settings</a>
  </nav>
  <main class="main" id="main"><p>Loading pending submissions…</p></main>
</div>

<script>
"use strict";
// Same state machine as the React page: loading → queue ⇄ confirm → done.
// Typing edits state directly (no re-render, so focus is never lost);
// approve/deny/screen changes re-render.
let screen = "loading";
let events = [], signups = [], result = null, submitting = false;

const $main = document.getElementById("main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

fetch("/api/pending")
  .then((r) => r.json())
  .then((data) => {
    if (data.error) throw new Error(data.error);
    events = data.events.filter((e) => e.status === "pending");
    signups = data.signups.filter((s) => s.status === "pending");
    screen = "queue";
    render();
  })
  .catch((err) => {
    $main.innerHTML = "<p>Failed to load: " + esc(err) + "</p>";
  });

const approved = (list) => list.filter((x) => x.status === "approved");
const denied = (list) => list.filter((x) => x.status === "denied");
const pendingCount = () => [...events, ...signups].filter((x) => x.status === "pending").length;

function eventRowHtml(e, i) {
  const cls = e.status === "approved" ? "event-approved" : e.status === "denied" ? "denied" : "";
  const fields = ["date", "title", "host", "location", "link"]
    .map((f) => `<input class="input" data-ev="${i}" data-f="${f}" value="${esc(e[f])}" placeholder="${f}" aria-label="${f}">`)
    .join("");
  return `<div class="approval-row ${cls}">
    <div class="fields">${fields}
      <textarea class="input" data-ev="${i}" data-f="description" placeholder="description" aria-label="description">${esc(e.description)}</textarea>
    </div>
    <div class="actions">
      <button class="btn ${e.status === "approved" ? "btn-primary" : "btn-secondary"}" data-act="approve-ev" data-i="${i}">Approve</button>
      <button class="btn ${e.status === "denied" ? "btn-danger" : "btn-secondary"}" data-act="deny-ev" data-i="${i}">Deny</button>
    </div>
  </div>`;
}

function signupRowHtml(s, i) {
  const cls = s.status === "approved" ? "signup-approved" : s.status === "denied" ? "denied" : "";
  const opt = (v, label) => `<option value="${v}" ${s.type === v ? "selected" : ""}>${label}</option>`;
  return `<div class="approval-row ${cls}">
    <div>${esc(s.email)} ${s.name ? "(" + esc(s.name) + ")" : ""}</div>
    <select class="input" data-su="${i}" aria-label="email type" style="max-width: 220px">
      ${opt("welcome", "Welcome Letter")}${opt("newsletter", "Newsletter")}${opt("both", "Both")}
    </select>
    <div class="actions">
      <button class="btn ${s.status === "approved" ? "btn-primary" : "btn-secondary"}" data-act="approve-su" data-i="${i}">Approve</button>
      <button class="btn ${s.status === "denied" ? "btn-danger" : "btn-secondary"}" data-act="deny-su" data-i="${i}">Deny</button>
    </div>
  </div>`;
}

function render() {
  const aEv = approved(events), dEv = denied(events), aSu = approved(signups), dSu = denied(signups);
  const head = `<div class="pagehead"><h1>Approvals</h1><p>New event and signup submissions, waiting on a decision.</p></div>`;

  if (screen === "queue") {
    $main.innerHTML = head + `
      <div class="stats">
        <div class="stat c-pink"><div class="n">${pendingCount()}</div><div class="l">Pending review</div></div>
        <div class="stat c-teal"><div class="n">${aEv.length}</div><div class="l">Approved this session</div></div>
        <div class="stat c-purple"><div class="n">${aSu.length}</div><div class="l">Signups this session</div></div>
        <div class="stat c-yellow"><div class="n">${dEv.length + dSu.length}</div><div class="l">Denied this session</div></div>
      </div>
      <section class="panel panel-pink">
        <div class="panelhead"><h2>Pending events</h2><span class="sub">Via Tally form</span></div>
        ${events.length === 0 ? '<p class="muted">Nothing pending.</p>' : events.map(eventRowHtml).join("")}
      </section>
      <section class="panel panel-purple">
        <div class="panelhead"><h2>Pending signups</h2><span class="sub">From the site's signup form</span></div>
        ${signups.length === 0 ? '<p class="muted">Nothing pending.</p>' : signups.map(signupRowHtml).join("")}
      </section>
      <div class="actions">
        <button class="btn btn-primary" data-act="to-confirm" ${aEv.length + dEv.length + aSu.length + dSu.length === 0 ? "disabled" : ""}>
          Review &amp; confirm (${aEv.length + aSu.length} approved)
        </button>
        ${pendingCount() > 0 ? `<span style="align-self:center;color:var(--color-neutral-600);font-size:13px">${pendingCount()} still undecided</span>` : ""}
      </div>`;
  }

  if (screen === "confirm") {
    $main.innerHTML = head + `
      <section class="panel">
        <div class="panelhead"><h2>Confirm changes</h2><span class="sub">One save, all at once — live instantly</span></div>
        <p style="color:var(--color-neutral-700)">${aEv.length} event(s) and ${aSu.length} signup(s) approved. ${dEv.length + dSu.length} denied — nothing happens to those.</p>
        <h3>Events going live</h3>
        ${aEv.length === 0 ? '<p class="muted">None.</p>' : aEv.map((e) => `
          <div class="approval-row event-approved"><h3>${esc(e.title)}</h3>
            <div class="meta"><span class="tag tag-pink">${esc(e.date)}</span><span class="tag tag-outline">${esc(e.host)} · ${esc(e.location)}</span></div>
          </div>`).join("")}
        <h3>Signups going out</h3>
        ${aSu.length === 0 ? '<p class="muted">None.</p>' : aSu.map((s) => `
          <div class="approval-row signup-approved"><span>${esc(s.email)}</span><span class="tag tag-purple">${esc(s.type)}</span></div>`).join("")}
        <div class="actions">
          <button class="btn btn-secondary" data-act="to-queue" ${submitting ? "disabled" : ""}>← Back to queue</button>
          <button class="btn btn-primary" data-act="submit" ${submitting ? "disabled" : ""}>${submitting ? "Saving…" : "CONFIRM — publish to live site"}</button>
        </div>
      </section>`;
  }

  if (screen === "done") {
    $main.innerHTML = head + `
      <section class="panel">
        <div class="panelhead"><h2>${result && result.ok ? "Done" : "Something went wrong"}</h2></div>
        ${result && result.ok
          ? `<p>Saved — the calendar is live. <a href="https://www.floridakimono.com/#events" target="_blank" rel="noreferrer">See it on the site</a>.</p>` +
            (result.emailResults && result.emailResults.length
              ? "<h3>Emails</h3>" + result.emailResults.map((r) =>
                  `<div class="approval-row">${esc(r.email)} (${esc(r.type)}) — ${r.ok ? "sent" : "failed: " + esc(r.error)}</div>`).join("")
              : "")
          : `<p style="color:#a33">Nothing was published. Error: ${esc(result && result.error)}</p>`}
        <div class="actions"><button class="btn btn-primary" data-act="reload">Back to queue</button></div>
      </section>`;
  }
}

// Typing → mutate state, no re-render (keeps focus).
$main.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.ev !== undefined && t.dataset.f) events[+t.dataset.ev][t.dataset.f] = t.value;
  if (t.dataset.su !== undefined && t.tagName === "SELECT") signups[+t.dataset.su].type = t.value;
});

// Buttons → update state, re-render.
$main.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn || btn.disabled) return;
  const act = btn.dataset.act, i = +btn.dataset.i;
  if (act === "approve-ev") events[i].status = events[i].status === "approved" ? "pending" : "approved";
  if (act === "deny-ev") events[i].status = events[i].status === "denied" ? "pending" : "denied";
  if (act === "approve-su") signups[i].status = signups[i].status === "approved" ? "pending" : "approved";
  if (act === "deny-su") signups[i].status = signups[i].status === "denied" ? "pending" : "denied";
  if (act === "to-confirm") screen = "confirm";
  if (act === "to-queue") screen = "queue";
  if (act === "reload") { window.location.reload(); return; }
  if (act === "submit") {
    submitting = true; render();
    try {
      const res = await fetch("/api/confirm-batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          approvedEvents: approved(events),
          deniedEventIds: denied(events).map((e) => e.id),
          approvedSignups: approved(signups),
          deniedSignupIds: denied(signups).map((s) => s.id),
        }),
      });
      result = await res.json();
    } catch (err) {
      result = { ok: false, error: String(err) };
    }
    submitting = false; screen = "done";
  }
  render();
});
</script>
</body>
</html>
